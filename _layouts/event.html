---
layout: default
---

<article
  class="event-page"
  data-offer-starts="{{ page.offer_starts }}"
  data-offer-ends="{{ page.offer_ends }}"
>
  <header class="event-header">
    <h1>{{ page.event_name }}</h1>
    {{ content }}
  </header>

  <section class="offer-message" data-offer-active hidden>
    <h2>Get {{ page.discount }} off</h2>
    <p>
      Sign up by <strong>{{ page.offer_ends_label }}</strong> to receive
      {{ page.discount }} off {{ page.discount_applies_to }}.
    </p>
  </section>

  <script src="https://form.jotform.com/jsform/{{ page.jotform_id }}?event={{ page.event | uri_escape }}"></script>
</article>

<script>
  (() => {
    const page = document.querySelector("[data-offer-ends]");
    const startsAt = Date.parse(page.dataset.offerStarts);
    const endsAt = Date.parse(page.dataset.offerEnds);
    const now = Date.now();
    const datesAreValid = Number.isFinite(startsAt) &&
      Number.isFinite(endsAt) && startsAt < endsAt;
    const offerIsActive = datesAreValid && now >= startsAt && now < endsAt;

    page.querySelector("[data-offer-active]").hidden = !offerIsActive;
  })();
</script>
